version: '3.8'
services:
  frontend:
    image: ghcr.io/pedroalmeida96/gamebuddy-frontend:latest
    container_name: frontend
    stdin_open: true
    ports:
      - "5173:5173"

  postgres:
    image: postgres
    container_name: postgres
    env_file: ./.env
    environment:
      POSTGRES_USER: $POSTGRESDB_USER
      POSTGRES_PASSWORD: $POSTGRESDB_ROOT_PASSWORD
      POSTGRES_DB: $POSTGRESDB_DATABASE
    ports:
      - "5432:5432"

  gamebuddy:
    image: ghcr.io/pedroalmeida96/gamebuddy:latest
    container_name: gamebuddy
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    env_file: ./.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gamebuddy
      SPRING_DATASOURCE_USERNAME: $POSTGRESDB_USER
      SPRING_DATASOURCE_PASSWORD: $POSTGRESDB_ROOT_PASSWORD
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
